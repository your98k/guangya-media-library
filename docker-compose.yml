services:
  guangya-media-library:
    build: .
    image: guangya-media-library:latest
    container_name: guangya-media-library
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
    environment:
      # 面板与 worker 之间的共享令牌，部署时务必改掉
      WORKER_TOKEN: "${WORKER_TOKEN:-change-me}"
      TZ: Asia/Shanghai
    restart: unless-stopped

  # 真实 worker（worker/real）：与面板同一服务组，`docker compose up -d` 会一并自动部署，
  # 不需要单独启用。没填账号类配置时它只会待命并在日志里列出缺什么，不影响面板使用。
  # 注意：不要再同时单独运行示例 worker（worker/example-worker.mjs），两者会抢同一批请求。
  worker:
    build:
      context: .
      dockerfile: worker/real/Dockerfile
    image: guangya-media-library-worker:latest
    container_name: guangya-media-library-worker
    environment:
      API_BASE: http://guangya-media-library:8080
      WORKER_TOKEN: ${WORKER_TOKEN:-change-me}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      JIAOFU_COOKIE: ${JIAOFU_COOKIE:-}
      MINI_COOKIE: ${MINI_COOKIE:-}
      GUANGYA_COOKIE: ${GUANGYA_COOKIE:-}
      GUANGYA_SESSION_FILE: ${GUANGYA_SESSION_FILE:-}
      GUANGYA_INGEST: ${GUANGYA_INGEST:-off}
      VERSION_POLICY: ${VERSION_POLICY:-max}
      WATCH_POLL_MINUTES: ${WATCH_POLL_MINUTES:-30}
      GUANGYA_QUARANTINE_FOLDER_ID: ${GUANGYA_QUARANTINE_FOLDER_ID:-}
      GUANGYA_LIBRARY_MAP: ${GUANGYA_LIBRARY_MAP:-}
      GUANGYA_UNCLASSIFIED_FOLDER_ID: ${GUANGYA_UNCLASSIFIED_FOLDER_ID:-}
      GUANGYA_CATEGORY_IDS: ${GUANGYA_CATEGORY_IDS:-}
      SOURCE_DELAY_MS: ${SOURCE_DELAY_MS:-1500}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-15}
      DRIVEMBY_TOKEN: ${DRIVEMBY_TOKEN:-}
      DRIVEMBY_REFRESH_URL: ${DRIVEMBY_REFRESH_URL:-https://drivemby.com/api/hooks/refresh}
      TZ: Asia/Shanghai
    depends_on:
      - guangya-media-library
    restart: unless-stopped
